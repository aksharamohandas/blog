<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Blogs - Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #210d1d;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(132, 61, 111, 0.05);
        }

        .admin-header h2 {
            font-size: 2rem;
            color: #4a1d41;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background-color: #843d6f;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: #6e325c;
        }

        .blog-feed {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .blog-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(132, 61, 111, 0.06);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .blog-title {
            font-size: 1.5rem;
            color: #4a1d41;
        }

        /* Safe dynamic container for images */
        .blog-image-wrapper {
            width: 100%;
            max-height: 350px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f3e8ff;
        }

        .blog-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blog-content {
            font-size: 1.05rem;
            color: #5c4e59;
            line-height: 1.6;
        }

        .meta-stamp {
            font-size: 0.85rem;
            color: #9c8e99;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #fcfaff;
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-folder-tree"></i> All Blog Posts</h2>
            <a href="{% url 'admin_home' %}" class="back-btn">Dashboard</a>
        </div>

        <div class="blog-feed">
            {% for blog in blogs %}
                <div class="blog-card">
                    <h3 class="blog-title">{{ blog.title }}</h3>

                    {% if blog.image %}
                        <div class="blog-image-wrapper">
                            <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
                        </div>
                    {% endif %}

                    <p class="blog-content">{{ blog.content }}</p>
                    
                    <div class="meta-stamp">
                        <i class="fa-regular fa-clock"></i> Posted on: {{ blog.created_at }}
                    </div>
                </div>
            {% empty %}
                <div style="text-align: center; background: white; padding: 40px; border-radius: 20px; color: #9c8e99;">
                    No blogs available in the system yet.
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
