<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blogs</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #210d1d;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Dashboard Header Layout */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(132, 61, 111, 0.05);
        }

        .dashboard-header h2 {
            font-size: 2rem;
            color: #4a1d41;
            font-weight: 700;
        }

        .add-btn {
            background-color: #843d6f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(132, 61, 111, 0.15);
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background-color: #6e325c;
            transform: translateY(-1px);
        }

        /* Blog Post Feed Grid */
        .blog-feed {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Beautiful Clean Blog Card */
        .blog-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(132, 61, 111, 0.06);
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: transform 0.2s ease;
        }

        .blog-card:hover {
            transform: translateY(-2px);
        }

        .blog-title {
            font-size: 1.6rem;
            color: #4a1d41;
            font-weight: 700;
        }

        /* Safe, Auto-Sizing Image Container */
        .blog-image-wrapper {
            width: 100%;
            max-height: 400px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #f3e8ff;
        }

        .blog-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .blog-content {
            font-size: 1.05rem;
            color: #5c4e59;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* Card Action Control Tools */
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            border-top: 2px solid #fcfaff;
            padding-top: 15px;
        }

        .action-link {
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .edit-link {
            background-color: #f3e8ff;
            color: #843d6f;
        }

        .edit-link:hover {
            background-color: #843d6f;
            color: #ffffff;
        }

        .delete-link {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .delete-link:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        /* Empty Feed Box State styling */
        .empty-state {
            text-align: center;
            background: #ffffff;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(132, 61, 111, 0.04);
            color: #9c8e99;
        }

        .empty-state i {
            font-size: 3rem;
            color: #e2d9eb;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="dashboard-header">
            <h2>My Blog Posts</h2>
            <a href="{% url 'add_blog' %}" class="add-btn">
                <i class="fa-solid fa-plus"></i> Add New Blog
            </a>
        </div>

        <div class="blog-feed">
            {% for blog in blogs %}
                <div class="blog-card">
                    
                    <h3 class="blog-title">{{ blog.title }}</h3>

                    {% if blog.image %}
                        <div class="blog-image-wrapper">
                            <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
                        </div>
                    {% endif %}

                    <p class="blog-content">{{ blog.content }}</p>

                    <div class="card-actions">
                        <a href="{% url 'edit_blog' blog.id %}" class="action-link edit-link">
                            <i class="fa-solid fa-pen-to-square"></i> Edit
                        </a>
                        <a href="{% url 'delete_blog' blog.id %}" class="action-link delete-link">
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </a>
                    </div>

                </div>
            {% empty %}
                <div class="empty-state">
                    <i class="fa-solid fa-folder-open"></i>
                    <p>No blogs published yet. Click the button above to get started!</p>
                </div>
            {% endfor %}
        </div>

    </div>

</body>
</html>
