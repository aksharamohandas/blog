<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login</title>
   <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   <style>
      /* Modern Reset & Layout Rules */
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'Fredoka', sans-serif;
      }

      body {
         background-color: #e0f2fe; /* Light sky blue outer background */
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         padding: 20px;
      }

      /* Main Split-Screen Container Card */
      .split-container {
         background-color: #ffffff;
         width: 100%;
         max-width: 950px;
         height: 600px;
         border-radius: 30px;
         box-shadow: 0 20px 50px rgba(14, 165, 233, 0.15);
         display: flex;
         overflow: hidden;
      }

      /* ====================================================
         LEFT PANEL: Art & Illustration Section
      ==================================================== */
      .art-panel {
         flex: 1.1;
         background: linear-gradient(135deg, #bae6fd, #7dd3fc); /* Beautiful gradient blues */
         padding: 40px;
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         text-align: center;
         position: relative;
         overflow: hidden;
      }

      /* Animated floating background spheres */
      .art-shape {
         position: absolute;
         background-color: rgba(2, 132, 199, 0.15);
         border-radius: 50%;
      }
      .shape-1 { width: 120px; height: 120px; top: -20px; left: -20px; }
      .shape-2 { width: 60px; height: 60px; bottom: 80px; right: 20px; }
      
      /* Central Creative Floating Graphic Area */
      .graphic-circle {
         width: 220px;
         height: 220px;
         background-color: #0ea5e9;
         border-radius: 50%;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-bottom: 40px;
         box-shadow: 0 15px 30px rgba(14, 165, 233, 0.3);
         position: relative;
         animation: floatSway 4s infinite ease-in-out;
      }

      @keyframes floatSway {
         0%, 100% { transform: translateY(0) rotate(0deg); }
         50% { transform: translateY(-12px) rotate(5deg); }
      }

      .graphic-circle i {
         font-size: 100px;
         color: #ffffff;
      }

      /* Decorative Orbit Rings */
      .graphic-circle::before {
         content: '';
         position: absolute;
         width: 280px;
         height: 90px;
         border: 4px solid rgba(255, 255, 255, 0.6);
         border-radius: 50%;
         transform: rotate(-25deg);
         pointer-events: none;
      }

      .art-panel h2 {
         color: #0369a1;
         font-size: 1.8rem;
         font-weight: 700;
         margin-bottom: 8px;
         z-index: 1;
      }

      .art-panel p {
         color: #0c4a6e;
         font-size: 0.95rem;
         max-width: 280px;
         line-height: 1.4;
         z-index: 1;
      }

      /* ====================================================
         RIGHT PANEL: Clean Action Form Section
      ==================================================== */
      .form-panel {
         flex: 1;
         padding: 50px 45px;
         display: flex;
         flex-direction: column;
         justify-content: center;
      }

      .logo-area {
         color: #0ea5e9;
         font-size: 2.5rem;
         margin-bottom: 20px;
      }

      .form-panel h1 {
         color: #0f172a;
         font-size: 2.2rem;
         font-weight: 700;
         margin-bottom: 4px;
      }

      .form-panel .subtitle {
         color: #64748b;
         font-size: 0.95rem;
         margin-bottom: 35px;
      }

      /* Input Fields Design */
      .form-group {
         margin-bottom: 20px;
      }

      .form-group label {
         display: block;
         font-size: 0.85rem;
         color: #64748b;
         font-weight: 600;
         margin-bottom: 6px;
      }

      .input-wrapper {
         position: relative;
         display: flex;
         align-items: center;
      }

      .input-wrapper input {
         width: 100%;
         padding: 14px 16px;
         border-radius: 12px;
         border: 2px solid #e2e8f0;
         outline: none;
         font-size: 0.95rem;
         color: #334155;
         transition: border-color 0.2s, box-shadow 0.2s;
      }

      .input-wrapper input:focus {
         border-color: #38bdf8;
         box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
      }

      /* Remember Me Checkbox Row */
      .form-options {
         display: flex;
         justify-content: space-between;
         align-items: center;
         font-size: 0.85rem;
         margin-bottom: 25px;
      }

      .remember-me {
         display: flex;
         align-items: center;
         gap: 6px;
         color: #64748b;
         cursor: pointer;
      }

      .forgot-link {
         color: #0ea5e9;
         text-decoration: none;
         font-weight: 500;
      }
      .forgot-link:hover { text-decoration: underline; }

      /* Sleek Wide Login Button */
      .submit-btn {
         width: 100%;
         background-color: #0ea5e9;
         color: #ffffff;
         border: none;
         padding: 14px;
         border-radius: 12px;
         font-size: 1.05rem;
         font-weight: 600;
         cursor: pointer;
         transition: background-color 0.2s, transform 0.1s;
         margin-bottom: 25px;
         box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
      }

      .submit-btn:hover { background-color: #0284c7; }
      .submit-btn:active { transform: scale(0.99); }

      /* Horizontal "Or Continue With" Divider */
      .divider {
         display: flex;
         align-items: center;
         text-align: center;
         color: #94a3b8;
         font-size: 0.8rem;
         margin-bottom: 20px;
      }
      .divider::before, .divider::after {
         content: '';
         flex: 1;
         border-bottom: 1px solid #e2e8f0;
      }
      .divider:not(:empty)::before { margin-right: .8em; }
      .divider:not(:empty)::after { margin-left: .8em; }

      /* Social Authentication Buttons Grid */
      .social-grid {
         display: grid;
         grid-template-columns: 1fr 1fr;
         gap: 12px;
         margin-bottom: 30px;
      }

      .social-btn {
         display: flex;
         justify-content: center;
         align-items: center;
         gap: 10px;
         padding: 12px;
         border: 2px solid #e2e8f0;
         border-radius: 12px;
         background-color: #ffffff;
         color: #475569;
         font-size: 0.9rem;
         font-weight: 500;
         cursor: pointer;
         transition: background-color 0.2s, border-color 0.2s;
      }

      .social-btn:hover {
         background-color: #f8fafc;
         border-color: #cbd5e1;
      }

      /* Switch Page Footer Action */
      .footer-text {
         text-align: center;
         font-size: 0.9rem;
         color: #64748b;
      }

      .footer-text a {
         color: #0ea5e9;
         text-decoration: none;
         font-weight: 600;
         margin-left: 4px;
      }
      .footer-text a:hover { text-decoration: underline; }
   </style>
</head>
<body>

   <div class="split-container">
      
      <div class="art-panel">
         <div class="art-shape shape-1"></div>
         <div class="art-shape shape-2"></div>

         <div class="graphic-circle">
            <i class="fa-solid fa-user-astronaut"></i>
         </div>

         <h2>Turn your ideas into reality.</h2>
         <p>Start for free and get attractive offers from the community</p>
      </div>

      <div class="form-panel">
         <div class="logo-area">
            <i class="fa-solid fa-infinity"></i>
         </div>

         <h1>Welcome Back</h1>
         <p class="subtitle">Login to your account</p>

         <form method="POST">
            {% csrf_token %}

            <div class="form-group">
               <label>Email or Username</label>
               <div class="input-wrapper">
                  <input type="text" name="username" placeholder="Enter your email or username" required>
               </div>
            </div>

            <div class="form-group">
               <label>Password</label>
               <div class="input-wrapper">
                  <input type="password" name="password" placeholder="••••••••" required>
               </div>
            </div>

            <div class="form-options">
               <label class="remember-me">
                  <input type="checkbox" name="remember"> Remember Me
               </label>
               <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-btn">Login</button>
         </form>

         <div class="divider">Or continue with</div>

         <div class="social-grid">
            <button class="social-btn" type="button">
               <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
            </button>
            <button class="social-btn" type="button">
               <i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook
            </button>
         </div>

         <p class="footer-text">
            Not Registered Yet? <a href="/register">Create an account</a>
         </p>
      </div>

   </div>

</body>
</html>
