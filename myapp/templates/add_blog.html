<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Immersive UI Canvas Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            /* Smooth tone background mimicking your login theme styling */
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Abstract ambient background details */
        .ambient-shape {
            position: absolute;
            background: #843d6f;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            z-index: 0;
        }
        .shape-1 { width: 300px; height: 300px; top: -10%; left: -5%; }
        .shape-2 { width: 250px; height: 250px; bottom: -5%; right: -5%; }

        /* Creator Panel Workspace Card */
        .creator-card {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 40px 45px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(132, 61, 111, 0.08);
            z-index: 1;
            position: relative;
        }

        /* Header Layout Styling */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
        }

        .card-header h2 {
            font-size: 2.2rem;
            color: #4a1d41;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h2 i {
            color: #843d6f;
        }

        .exit-workspace-btn {
            width: 42px;
            height: 42px;
            background-color: #f3e8ff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #843d6f;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .exit-workspace-btn:hover {
            transform: scale(1.05);
            background-color: #843d6f;
            color: #ffffff;
        }

        /* Dynamic Form Blocks */
        .form-block {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
        }

        .form-block label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a1d41;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        /* Borderless-style Input Elements */
        .form-block input[type="text"] {
            width: 100%;
            background-color: #fcfaff;
            border: 2px solid #e2d9eb;
            outline: none;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 1.05rem;
            color: #210d1d;
            transition: all 0.25s ease;
        }

        .form-block input[type="text"]:focus {
            border-color: #843d6f;
            background-color: #ffffff;
            box-shadow: 0 10px 20px rgba(132, 61, 111, 0.05);
        }

        /* Longform Story Surface */
        .form-block textarea {
            width: 100%;
            background-color: #fcfaff;
            border: 2px solid #e2d9eb;
            outline: none;
            padding: 18px 20px;
            border-radius: 20px;
            font-size: 1.05rem;
            color: #210d1d;
            min-height: 180px;
            resize: vertical;
            line-height: 1.5;
            transition: all 0.25s ease;
        }

        .form-block textarea:focus {
            border-color: #843d6f;
            background-color: #ffffff;
            box-shadow: 0 10px 20px rgba(132, 61, 111, 0.05);
        }

        /* Interactive Dynamic Upload Deck */
        .upload-deck {
            background-color: #fcfaff;
            border: 2px dashed #c0b2ce;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .upload-deck:hover {
            border-color: #843d6f;
            background-color: #ffffff;
        }

        .upload-deck i.deck-icon {
            font-size: 2.4rem;
            color: #843d6f;
            margin-bottom: 8px;
        }

        .upload-deck p {
            font-size: 0.95rem;
            color: #5c4e59;
            font-weight: 500;
        }

        .upload-deck span {
            font-size: 0.8rem;
            color: #9c8e99;
            display: block;
            margin-top: 3px;
        }

        /* Native input hidden overlay */
        .upload-deck input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 1;
        }

        /* Real-Time Graphic Preview Viewport Overlay */
        .preview-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 18px;
            z-index: 2;
            overflow: hidden;
        }

        .preview-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Rounded Clear Image Media Button */
        .clear-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #843d6f;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .clear-image-btn:hover {
            background-color: #b91c1c;
        }

        /* Premium Smooth Theme Submission Action Button */
        .action-submit-btn {
            width: 100%;
            background-color: #843d6f;
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(132, 61, 111, 0.2);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .action-submit-btn:hover {
            background-color: #6e325c;
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(132, 61, 111, 0.25);
        }

        .action-submit-btn:active {
            transform: translateY(1px);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .creator-card { padding: 30px 20px; }
            .card-header h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-shape shape-1"></div>
    <div class="ambient-shape shape-2"></div>

    <div class="creator-card">
        
        <div class="card-header">
            <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Add Blog</h2>
            <a href="{% url 'user_home' %}" class="exit-workspace-btn" title="Back to home">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-block">
                <label>Title</label>
                <input type="text" name="title" placeholder="Give your masterpiece an incredible title..." required>
            </div>

            <div class="form-block">
                <label>Content</label>
                <textarea name="content" placeholder="Type your narrative insights or deep-dive articles here..." required></textarea>
            </div>

            <div class="form-block">
                <label>Image (Optional)</label>
                <div class="upload-deck">
                    <i class="fa-solid fa-cloud-arrow-up deck-icon"></i>
                    <p>Click to select or drop your image file here</p>
                    <span>Supports premium file extensions (PNG, JPG, WebP)</span>
                    
                    <input type="file" name="image" id="fileFieldNode" accept="image/*">
                    
                    <div class="preview-overlay" id="previewOverlayWindow">
                        <button type="button" class="clear-image-btn" id="ejectFileBtn" title="Remove image">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                        <img id="imageRenderTarget" src="" alt="Live cover illustration preview container">
                    </div>
                </div>
            </div>

            <button type="submit" class="action-submit-btn">
                <i class="fa-solid fa-paper-plane"></i> Add Blog
            </button>

        </form>
    </div>

    <script>
        const fileFieldNode = document.getElementById('fileFieldNode');
        const previewOverlayWindow = document.getElementById('previewOverlayWindow');
        const imageRenderTarget = document.getElementById('imageRenderTarget');
        const ejectFileBtn = document.getElementById('ejectFileBtn');

        // Watch input values to instantiate FileReader container safely
        fileFieldNode.addEventListener('change', function() {
            const uploadedFile = this.files[0];
            if (uploadedFile) {
                const standardReader = new FileReader();
                standardReader.addEventListener('load', function() {
                    imageRenderTarget.setAttribute('src', this.result);
                    previewOverlayWindow.style.display = 'block';
                });
                standardReader.readAsDataURL(uploadedFile);
            }
        });

        // Safe drop framework to reset file field completely if clearing uploaded item
        ejectFileBtn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            
            fileFieldNode.value = ''; // Safely clears field payload data data structures
            imageRenderTarget.setAttribute('src', '');
            previewOverlayWindow.style.display = 'none';
        });
    </script>
</body>
</html>
